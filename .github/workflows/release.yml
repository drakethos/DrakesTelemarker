name: Release

# Hexium only (no Thunderstore). Push a tag to release:
#   Stable: v0.1.0          -> Hexium + GitHub release
#   Beta:   v0.1.0-beta.1   -> Hexium + GitHub prerelease
# The tag must match <Version> in mod.package.props, and CHANGELOG.md needs a "## <version>" section.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # ubuntu-22.04: mono-complete + nuget are pre-installed.
    # dotnet SDK added via setup-dotnet for Roslyn (C#10).
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      zip: ${{ steps.pkg.outputs.zip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Version from mod.package.props (must match release tag v{Version}) ───
      - name: Resolve release version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_PRERELEASE=false
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            IS_PRERELEASE=true
          else
            echo "::error::Tag ${TAG} must be vX.Y.Z (stable) or vX.Y.Z-beta.N / -alpha.N / -rc.N (prerelease)." >&2
            exit 1
          fi

          PKG_VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' mod.package.props | head -1 | xargs)
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Could not read <Version> from mod.package.props" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG} (${TAG_VERSION}) does not match mod.package.props (${PKG_VERSION}). Tag v${PKG_VERSION} or update <Version>." >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release version: $PKG_VERSION (prerelease=$IS_PRERELEASE)"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: |
          nuget restore DrakesTelemarker.csproj -PackagesDirectory packages

      # ── Stage game / BepInEx DLLs from Pfhoenix ─────────────────────────────
      #  Fake "Valheim install" tree:
      #    ci_valheim/valheim_Data/Managed/          <- CorlibPath
      #      publicized_assemblies/                  <- PublicizedAssembliesPath
      #    ci_valheim/BepInEx/core/                  <- BepInExPath
      - name: Stage game DLLs from Pfhoenix package
        run: |
          PFHOENIX_LIB=$(ls -d packages/Pfhoenix.Valheim.ModProjectReferences.*/lib/net46 2>/dev/null | head -1)
          if [ -z "$PFHOENIX_LIB" ]; then
            echo "ERROR: Pfhoenix package not found" >&2; ls packages/ >&2; exit 1
          fi
          echo "Pfhoenix lib: $PFHOENIX_LIB"

          MANAGED="ci_valheim/valheim_Data/Managed"
          PUBLICIZED="$MANAGED/publicized_assemblies"
          BEPINEX="ci_valheim/BepInEx/core"
          mkdir -p "$MANAGED" "$PUBLICIZED" "$BEPINEX"

          cp "$PFHOENIX_LIB/"*.dll "$MANAGED/"

          cp "$PFHOENIX_LIB/assembly_valheim.dll" "$PUBLICIZED/assembly_valheim_publicized.dll"
          cp "$PFHOENIX_LIB/assembly_utils.dll"   "$PUBLICIZED/assembly_utils_publicized.dll"
          cp "$PFHOENIX_LIB/gui_framework.dll"    "$PUBLICIZED/gui_framework_publicized.dll"

          for src in assembly_googleanalytics assembly_guiutils assembly_lux \
                     assembly_postprocessing assembly_simplemeshcombine \
                     assembly_sunshafts SoftReferenceableAssets; do
            [ -f "$PFHOENIX_LIB/$src.dll" ] && \
              cp "$PFHOENIX_LIB/$src.dll" "$PUBLICIZED/${src}_publicized.dll" || true
          done

          cp "$PFHOENIX_LIB/0Harmony.dll" "$BEPINEX/"
          cp "$PFHOENIX_LIB/bepinex.dll"  "$BEPINEX/BepInEx.dll"

          echo "VALHEIM_INSTALL=$(pwd)/ci_valheim" >> "$GITHUB_ENV"

      - name: Build
        env:
          CI_NET48_FWPATH: ${{ github.workspace }}/packages/Microsoft.NETFramework.ReferenceAssemblies.net48.1.0.3/build
          CI_SKIP_POST_BUILD: "true"
        run: |
          CI_ROOT="$(pwd)/ci_valheim"
          MANAGED="$CI_ROOT/valheim_Data/Managed"
          dotnet msbuild DrakesTelemarker.csproj \
            /p:Configuration=Release \
            /p:TargetFrameworkVersion=v4.8 \
            /p:BepInExPath="$CI_ROOT/BepInEx" \
            /p:CorlibPath="$MANAGED" \
            /p:PublicizedAssembliesPath="$MANAGED/publicized_assemblies" \
            /p:Version="${{ steps.ver.outputs.version }}" \
            /t:Build \
            /v:minimal

      # Hexium uses the Thunderstore package layout (manifest.json + icon.png + README.md at the root).
      - name: Assemble package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG_DIR="DrakeMods-DrakesTelemarker-${VERSION}"
          ZIP_NAME="DrakeMods-DrakesTelemarker-${VERSION}.zip"

          mkdir -p "$PKG_DIR"
          cp bin/Release/DrakesTelemarker.dll "$PKG_DIR/"
          cp README.md                      "$PKG_DIR/"
          cp icon.png                       "$PKG_DIR/"
          cp CHANGELOG.md                   "$PKG_DIR/"

          dotnet msbuild DrakesTelemarker.csproj \
            /p:Version="$VERSION" \
            /p:ThunderstoreManifestDir="$PKG_DIR" \
            /t:WriteThunderstoreManifest \
            /v:minimal

          cd "$PKG_DIR" && zip -r "../$ZIP_NAME" . && cd ..

          # Guard: exactly one icon.png at the zip root, 256x256 (store listing icon).
          ICON_PATHS=$(zipinfo -1 "$ZIP_NAME" | grep -E '(^|/)icon\.png$' || true)
          ICON_COUNT=$(printf '%s\n' "$ICON_PATHS" | grep -c . || true)
          if [ "$ICON_COUNT" -ne 1 ] || [ "$ICON_PATHS" != "icon.png" ]; then
            echo "::error::Package must contain exactly one icon.png at zip root (found $ICON_COUNT):" >&2
            printf '%s\n' "$ICON_PATHS" >&2
            exit 1
          fi
          python3 - "$ZIP_NAME" <<'PY'
          import struct, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          data = z.read("icon.png")
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("icon.png is not a PNG")
          w, h = struct.unpack(">II", data[16:24])
          if (w, h) != (256, 256):
              raise SystemExit(f"icon.png must be 256x256, got {w}x{h}")
          print(f"OK package icon.png {w}x{h} ({len(data)} bytes)")
          PY

          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP_NAME"

      # Release notes = this version's CHANGELOG.md section, wrapped with install / bug-report info.
      # The run fails if CHANGELOG.md has no "## <version>" heading, so notes can't be forgotten.
      - name: Write release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          IS_PRERELEASE: ${{ steps.ver.outputs.is_prerelease }}
          REPO: ${{ github.repository }}
        run: |
          SECTION=$(awk -v v="## ${VERSION}" '
            $0 == v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e 's/^###/##/')
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section (or it is empty)." >&2
            exit 1
          fi
          {
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "> **Beta build.** Back up your worlds, and please [report bugs](https://github.com/${REPO}/issues) with your \`BepInEx/LogOutput.log\`."
              echo
            fi
            printf '%s\n' "$SECTION"
            echo
            echo "## Install"
            echo "- **Hexium:** https://valheim.hexium.gg/mods/DrakeMods/DrakesTelemarker (dependencies install automatically)."
            echo "- **Zip below:** use your mod manager's \"Import local mod\" (Gale, r2modman), or extract into \`BepInEx/plugins/DrakeMods-DrakesTelemarker/\`."
            echo "- Requires devcommands: run \`devcommands\` in the console before using bookmark commands."
            echo
            echo "---"
            echo "Full history: [CHANGELOG.md](https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md) | How to use it: [README](https://github.com/${REPO}/blob/${TAG}/README.md)"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakesTelemarker ${{ steps.ver.outputs.version }}${{ steps.ver.outputs.is_prerelease == 'true' && ' (beta)' || '' }}"
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          body_path: release-notes.md
          files: ${{ steps.pkg.outputs.zip }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-zip
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  publish-hexium:
    needs: build-and-release
    # Kill switch: repo variable HEXIUM_PUBLISH=false skips the upload (GitHub release still made),
    # e.g. for a manual first upload. Unset or any other value publishes.
    #   gh variable set HEXIUM_PUBLISH --body false   /   gh variable delete HEXIUM_PUBLISH
    if: vars.HEXIUM_PUBLISH != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publish script
        uses: actions/checkout@v4

      - name: Download package zip
        uses: actions/download-artifact@v4
        with:
          name: package-zip
          path: dist

      # publish-hexium.py (not tcli) so Hexium can receive -beta.N versions.
      - name: Publish package to Hexium
        env:
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
          ZIP_NAME: ${{ needs.build-and-release.outputs.zip }}
        run: |
          set -euo pipefail
          if [ -z "${HEXIUM_TOKEN}" ]; then
            echo "::error::HEXIUM_TOKEN secret is not set" >&2
            exit 1
          fi
          python3 .github/scripts/publish-hexium.py \
            --file "dist/${ZIP_NAME}" \
            --repository "https://valheim.hexium.gg" \
            --namespace "DrakeMods" \
            --communities "valheim" \
            --categories "Quality of Life,Valheim 1.0"
