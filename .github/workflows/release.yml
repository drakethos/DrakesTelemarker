name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    # ubuntu-22.04: mono-complete + nuget are pre-installed.
    # dotnet SDK added via setup-dotnet for Roslyn (C#10).
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
      zip: ${{ steps.pkg.outputs.zip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Version from mod.package.props (must match release tag v{Version}) ───
      - name: Resolve release version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_PRERELEASE=false
            CHANNEL=stable
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            IS_PRERELEASE=true
            CHANNEL=beta
          else
            echo "::error::Tag ${TAG} must be vX.Y.Z (stable) or vX.Y.Z-beta.N (Hexium beta)." >&2
            exit 1
          fi

          PKG_VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' mod.package.props | head -1 | xargs)
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Could not read <Version> from mod.package.props" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG} (${TAG_VERSION}) does not match mod.package.props (${PKG_VERSION}). Tag v${PKG_VERSION} or update <Version>." >&2
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release version: $PKG_VERSION (${CHANNEL}; mod.package.props)"

      # ── Install .NET SDK (Roslyn C#10) ──────────────────────────────────────
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ── Restore NuGet packages (JotunnLib, HarmonyX, Pfhoenix game refs, net48 ref pack) ──
      - name: Restore NuGet packages
        run: |
          nuget restore DrakesTelemarker.csproj -PackagesDirectory packages

      # ── Stage game / BepInEx DLLs from Pfhoenix ─────────────────────────────
      #
      #  Fake "Valheim install" tree:
      #    ci_valheim/valheim_Data/Managed/          <- CorlibPath
      #      publicized_assemblies/                  <- PublicizedAssembliesPath
      #    ci_valheim/BepInEx/core/                  <- BepInExPath
      # ────────────────────────────────────────────────────────────────────────
      - name: Stage game DLLs from Pfhoenix package
        run: |
          PFHOENIX_LIB=$(ls -d packages/Pfhoenix.Valheim.ModProjectReferences.*/lib/net46 2>/dev/null | head -1)
          if [ -z "$PFHOENIX_LIB" ]; then
            echo "ERROR: Pfhoenix package not found" >&2; ls packages/ >&2; exit 1
          fi
          echo "Pfhoenix lib: $PFHOENIX_LIB"

          MANAGED="ci_valheim/valheim_Data/Managed"
          PUBLICIZED="$MANAGED/publicized_assemblies"
          BEPINEX="ci_valheim/BepInEx/core"
          mkdir -p "$MANAGED" "$PUBLICIZED" "$BEPINEX"

          cp "$PFHOENIX_LIB/"*.dll "$MANAGED/"

          cp "$PFHOENIX_LIB/assembly_valheim.dll" "$PUBLICIZED/assembly_valheim_publicized.dll"
          cp "$PFHOENIX_LIB/assembly_utils.dll"   "$PUBLICIZED/assembly_utils_publicized.dll"
          cp "$PFHOENIX_LIB/gui_framework.dll"    "$PUBLICIZED/gui_framework_publicized.dll"

          for src in assembly_googleanalytics assembly_guiutils assembly_lux \
                     assembly_postprocessing assembly_simplemeshcombine \
                     assembly_sunshafts SoftReferenceableAssets; do
            [ -f "$PFHOENIX_LIB/$src.dll" ] && \
              cp "$PFHOENIX_LIB/$src.dll" "$PUBLICIZED/${src}_publicized.dll" || true
          done

          cp "$PFHOENIX_LIB/0Harmony.dll" "$BEPINEX/"
          cp "$PFHOENIX_LIB/bepinex.dll"  "$BEPINEX/BepInEx.dll"

          echo "VALHEIM_INSTALL=$(pwd)/ci_valheim" >> "$GITHUB_ENV"

      # ── Build (Release) ─────────────────────────────────────────────────────
      #  Directory.Build.props reads CI_NET48_FWPATH -> net48 ref pack.
      #  Directory.Build.targets reads CI_SKIP_POST_BUILD -> skips the PowerShell
      #  zip step; the zip is assembled in the next step.
      - name: Build
        env:
          CI_NET48_FWPATH: ${{ github.workspace }}/packages/Microsoft.NETFramework.ReferenceAssemblies.net48.1.0.3/build
          CI_SKIP_POST_BUILD: "true"
        run: |
          CI_ROOT="$(pwd)/ci_valheim"
          MANAGED="$CI_ROOT/valheim_Data/Managed"
          dotnet msbuild DrakesTelemarker.csproj \
            /p:Configuration=Release \
            /p:TargetFrameworkVersion=v4.8 \
            /p:BepInExPath="$CI_ROOT/BepInEx" \
            /p:CorlibPath="$MANAGED" \
            /p:PublicizedAssembliesPath="$MANAGED/publicized_assemblies" \
            /p:Version="${{ steps.ver.outputs.version }}" \
            /t:Build \
            /v:minimal

      # ── Assemble Thunderstore-style zip (same layout as PackageMod) ─────────
      - name: Assemble package
        id: pkg
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PKG_DIR="DrakeMods-DrakesTelemarker-${VERSION}"
          ZIP_NAME="DrakeMods-DrakesTelemarker-${VERSION}.zip"

          mkdir -p "$PKG_DIR"
          cp bin/Release/DrakesTelemarker.dll "$PKG_DIR/"
          cp README.md                      "$PKG_DIR/"
          cp icon.png                       "$PKG_DIR/"
          cp CHANGELOG.md                   "$PKG_DIR/"

          dotnet msbuild DrakesTelemarker.csproj \
            /p:Version="$VERSION" \
            /p:ThunderstoreManifestDir="$PKG_DIR" \
            /t:WriteThunderstoreManifest \
            /v:minimal

          cd "$PKG_DIR" && zip -r "../$ZIP_NAME" . && cd ..

          echo "zip=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP_NAME"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-zip
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

      # ── GitHub Release (stable or beta) ─────────────────────────────────────
      - name: Create GitHub Release (stable)
        if: steps.ver.outputs.is_prerelease != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakesTelemarker ${{ steps.ver.outputs.version }}"
          prerelease: false
          body: |
            ## DrakesTelemarker v${{ steps.ver.outputs.version }}

            Zip attached. CI also publishes it to **Hexium**.

            ### Install
            Drop the zip into **Gale**, **r2modman** or **Thunderstore Mod Manager** via "Import local mod", or extract into:
            ```
            BepInEx/plugins/DrakeMods-DrakesTelemarker/
            ```

            **Requires devcommands** - run `devcommands` in the console before using bookmark commands.

            ---
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for what's new.
          files: ${{ steps.pkg.outputs.zip }}

      - name: Create GitHub Release (beta)
        if: steps.ver.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DrakesTelemarker ${{ steps.ver.outputs.version }} (beta)"
          prerelease: true
          body: |
            ## DrakesTelemarker v${{ steps.ver.outputs.version }} (beta)

            Beta build. Published to **Hexium** only (not a stable store release).

            ### Install
            Drop the zip into **Gale**, **r2modman** or **Thunderstore Mod Manager** via "Import local mod", or extract into:
            ```
            BepInEx/plugins/DrakeMods-DrakesTelemarker/
            ```

            ---
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.tag }}/CHANGELOG.md) for the full list.
          files: ${{ steps.pkg.outputs.zip }}

  # ── Hexium (stable + beta). publish-hexium.py accepts -beta.N versions. ──
  publish-hexium:
    needs: build-and-release
    if: needs.build-and-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publish script
        uses: actions/checkout@v4

      - name: Download package zip
        uses: actions/download-artifact@v4
        with:
          name: package-zip
          path: dist

      - name: Publish package to Hexium
        env:
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
          ZIP_NAME: ${{ needs.build-and-release.outputs.zip }}
        run: |
          set -euo pipefail
          if [ -z "${HEXIUM_TOKEN}" ]; then
            echo "::error::HEXIUM_TOKEN secret is not set" >&2
            exit 1
          fi
          python3 .github/scripts/publish-hexium.py \
            --file "dist/${ZIP_NAME}" \
            --repository "https://valheim.hexium.gg" \
            --namespace "DrakeMods" \
            --communities "valheim" \
            --categories "Quality of Life,Valheim 1.0"
